<!DOCTYPE html>
<html lang="en">
<head>

    <title>Creating a Responsive Stylesheet</title>
    <link rel="stylesheet" href="style.css">

    <main>
        <div>

        <div>
            <h2>Section 2</h2>
            <img src="https://picsum.photos/id/11/400/300" alt="Image 2">

</html>
